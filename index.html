<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Sora:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Site LPF</title>
</head>
<body>
    <header>
        <a href="#hero" class="logo">
            <span class="logo_laranja">Liga do Pulmão</span>
            <span class="logo_azul">da Fisioterapia</span>
        </a>

        <button class="menu_botao" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="menu">
            <ul>
                <li><a href="#videos">Vídeos</a></li>
                <li><a href="#sobre">Sobre nós</a></li>
                <li><a href="#faq">Perguntas Frequentes</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="primeira_tela">
            <section class="secao" id="hero">
                <div class="hero_texto">
                    <h1>Respire fundo,<br>viva melhor.</h1>
                    <p>Assista aos vídeos de exercícios e conteúdos educativos da Liga do Pulmão onde e quando quiser. Cuide da sua respiração no conforto de casa.</p>
                    <a href="#videos" class="botao">Conheça os vídeos</a>
                </div>

                <img src="midias/Logo.svg" alt="" class="hero_imagem">
            </section>
            <div class="fita" aria-hidden="true"></div>
        </div> 

        <section class="secao" id="videos">
            <h2>Vídeos</h2>

            <div class="videos_filtros" role="group" aria-label="Categorias de vídeos">
                <button class="videos_filtro" data-categoria="todos" aria-pressed="true">Todos os vídeos</button>
                <button class="videos_filtro" data-categoria="exercicios" aria-pressed="false">Exercícios</button>
                <button class="videos_filtro" data-categoria="educacao" aria-pressed="false">Educacionais</button>
            </div>

            <div class="videos_lista" id="videos_lista" aria-live="polite"></div>
        </section>

        <section class="secao" id="sobre"></section>
        <section class="secao" id="faq"></section>
    </main>

    <footer></footer>
    <script src="videos.js"></script>
    <script src="script.js"></script>
</body>
</html>
